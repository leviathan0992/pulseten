# Release a version: build the prebuilt Go libraries on each platform, publish
# them to pulseten-go-libs, make the Go module require them, tag the release,
# then install it with `go get` on a clean machine.
#
# Tags are permanent once the Go module proxy has seen them, so rehearse a
# release with a pre-release version such as 0.1.0-rc.1 first.
#
# Requires the GO_LIBS_TOKEN secret: a fine-grained token with write access
# to the contents of leviathan0992/pulseten-go-libs.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, for example 0.1.0-rc.1"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  LIBS_REPO: leviathan0992/pulseten-go-libs
  LIBS_MODULE: github.com/leviathan0992/pulseten-go-libs
  PLATFORMS: darwin-arm64 linux-amd64 linux-amd64-musl linux-arm64 linux-arm64-musl

jobs:
  check:
    name: Check version and CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and tags
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "release from main only, not $GITHUB_REF" >&2
            exit 1
          fi
          for tag in "v$VERSION" "go/v$VERSION"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "tag $tag already exists" >&2
              exit 1
            fi
          done

      # A pre-release has the version its release will have: 0.1.0-rc.1 is
      # built from a header that says 0.1.0.
      - name: Compare with the header
        run: |
          header=$(sed -n 's/^#define PULSETEN_VERSION_STRING "\(.*\)"$/\1/p' \
            include/pulseten.h)
          if [ "${VERSION%%-*}" != "$header" ]; then
            echo "version $VERSION, but pulseten.h says $header" >&2
            exit 1
          fi

      # The release commits made by publish-go change only go.mod and go.sum,
      # and do not start CI, so look at the last commit that changed more.
      - name: Require a successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git log -1 --format=%H -- . ':!go/go.mod' ':!go/go.sum')
          passed=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$commit" --status success --json databaseId --jq length)
          if [ "$passed" = 0 ]; then
            echo "no successful CI run on main for $commit" >&2
            exit 1
          fi

  build-macos:
    name: Build ${{ matrix.platform }}
    needs: check
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      matrix:
        platform: [darwin-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install tools
        run: brew install ninja

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build archives
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --target pulseten_go_archives

      - name: Package module
        run: |
          python3 scripts/go_module.py ${{ matrix.platform }} \
            build/go-archives "dist/${{ matrix.platform }}"

      # Link the Go package against the packaged module, with pkg-config
      # unavailable, exactly as a user's build would.
      - name: Test the Go package
        env:
          PKG_CONFIG: "false"
        run: |
          printf 'go 1.22\n\nuse (\n\t./go\n\t./dist/%s\n)\n' \
            "${{ matrix.platform }}" > go.work
          cd go
          go vet ./...
          go test -race -count=1 ./...

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          retention-days: 7

  # manylinux_2_28 builds against glibc 2.28. Its own GCC 14 needs a newer
  # libstdc++ than Debian 12 and Ubuntu 22.04 have, so build with GCC 12. The
  # verify job links the libraries on both.
  build-linux:
    name: Build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install tools
        run: |
          dnf install -y gcc-toolset-12-gcc-c++
          /opt/python/cp312-cp312/bin/pip install cmake ninja
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
          echo /opt/rh/gcc-toolset-12/root/usr/bin >> "$GITHUB_PATH"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Build archives
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --target pulseten_go_archives

      - name: Package module
        run: |
          python3 scripts/go_module.py ${{ matrix.platform }} \
            build/go-archives "dist/${{ matrix.platform }}"

      # Link the Go package against the packaged module, with pkg-config
      # unavailable, exactly as a user's build would.
      - name: Test the Go package
        env:
          PKG_CONFIG: "false"
        run: |
          printf 'go 1.22\n\nuse (\n\t./go\n\t./dist/%s\n)\n' \
            "${{ matrix.platform }}" > go.work
          cd go
          go vet ./...
          go test -race -count=1 ./...

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          retention-days: 7

  # Alpine 3.20 has musl 1.2.5 and GCC 13. Its compiler must not be newer than
  # the ones users link with. JavaScript actions do not run in Alpine containers
  # on ARM64, so only the build itself runs in the container.
  build-musl:
    name: Build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - platform: linux-amd64-musl
            os: ubuntu-24.04
          - platform: linux-arm64-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Link the Go package against the packaged module, with pkg-config
      # unavailable, exactly as a user's build would.
      - name: Build, package and test
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e PLATFORM="${{ matrix.platform }}" \
            -e PKG_CONFIG=false -e GOTOOLCHAIN=local alpine:3.20 sh -ec '
              apk add --no-cache build-base cmake git go linux-headers ninja python3
              git config --global --add safe.directory "*"
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build --target pulseten_go_archives
              python3 scripts/go_module.py "$PLATFORM" build/go-archives "dist/$PLATFORM"
              printf "go 1.22\n\nuse (\n\t./go\n\t./dist/%s\n)\n" "$PLATFORM" > go.work
              cd go
              go vet -tags pulseten_use_musl ./...
              go test -count=1 -tags pulseten_use_musl ./...
            '

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.platform }}
          retention-days: 7

  publish-libs:
    name: Publish prebuilt libraries
    needs: [build-macos, build-linux, build-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBS_REPO }}
          token: ${{ secrets.GO_LIBS_TOKEN }}
          path: libs

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Commit and tag
        working-directory: libs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for platform in $PLATFORMS; do
            if git ls-remote --exit-code --tags origin "refs/tags/$platform/v$VERSION" >/dev/null; then
              echo "tag $platform/v$VERSION already exists" >&2
              exit 1
            fi
            rm -rf "$platform"
            cp -R "../dist/$platform" "$platform"
            cp LICENSE THIRD_PARTY_NOTICES.md "$platform/"
          done
          git add -A
          git commit -m "Release v$VERSION"
          for platform in $PLATFORMS; do
            git tag "$platform/v$VERSION"
          done
          git push origin HEAD:main
          git push origin $(for p in $PLATFORMS; do echo "refs/tags/$p/v$VERSION"; done)

  publish-go:
    name: Tag the release
    needs: publish-libs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false

      # Fetch the new tags directly; the public proxy may not list them yet.
      - name: Require the prebuilt libraries
        working-directory: go
        env:
          GOPROXY: direct
          GONOSUMDB: github.com/leviathan0992
          GOFLAGS: -mod=mod
        run: |
          for platform in $PLATFORMS; do
            go mod edit -require="$LIBS_MODULE/$platform@v$VERSION"
          done
          go mod tidy

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/go.mod go/go.sum
          git commit -m "go: require prebuilt libraries v$VERSION"
          git tag "v$VERSION"
          git tag "go/v$VERSION"
          git push origin HEAD:main
          git push origin "refs/tags/v$VERSION" "refs/tags/go/v$VERSION"

  verify:
    name: Verify go get on ${{ matrix.container || matrix.os }} (${{ matrix.os }})
    needs: publish-go
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The containers have an older libstdc++ than the runners, which the
      # prebuilt Linux libraries must also link against.
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
        container: [""]
        include:
          - { os: ubuntu-24.04, container: "debian:12" }
          - { os: ubuntu-24.04, container: "ubuntu:22.04" }
          - { os: ubuntu-24.04-arm, container: "debian:12" }
          - { os: ubuntu-24.04-arm, container: "ubuntu:22.04" }
    steps:
      - name: Install tools
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates g++ git

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # A new module that uses only the published packages, without pkg-config
      # or any PulseTen installation.
      - name: go get and run
        env:
          GOPROXY: direct
          GONOSUMDB: github.com/leviathan0992
          PKG_CONFIG: "false"
        run: |
          mkdir demo && cd demo
          go mod init demo
          cp ../examples/quickstart.go main.go
          go get "github.com/leviathan0992/pulseten/go@v$VERSION"
          go run .

  verify-musl:
    name: Verify go get on ${{ matrix.image }} (${{ matrix.os }})
    needs: publish-go
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ["alpine:3.20", "alpine:3.22"]
    steps:
      - uses: actions/checkout@v4

      - name: go get and run
        run: |
          docker run --rm -v "$PWD/examples:/examples:ro" -e VERSION \
            -e GOPROXY=direct -e GONOSUMDB=github.com/leviathan0992 \
            -e PKG_CONFIG=false -e GOTOOLCHAIN=local ${{ matrix.image }} sh -ec '
              apk add --no-cache g++ git go
              mkdir /demo && cd /demo
              go mod init demo
              cp /examples/quickstart.go main.go
              go get "github.com/leviathan0992/pulseten/go@v$VERSION"
              go run -tags pulseten_use_musl .
            '
